<section class="content">
  <div class="content-block">
    <div class="block-header">
    </div>
        <style>
        :root {
            --primary: #1a4f72;
            --secondary: #3c7dbd;
            --accent: #43aa8b;
            --warning: #f9c74f;
            --danger: #e63946;
            --light: #f1faee;
            --dark: #1d3557;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --card-radius: 12px;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #334155;
        }
        
        .content {
            padding: 20px;
        }
        
        .content-block {
            background: transparent;
        }
        
        .welcome-card {
            background: rgb(175, 176, 198);
            border-radius: var(--card-radius);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            margin-bottom: 25px;
        }
        
        .welcome-content {
            padding: 25px;
        }
        
        .bank-icon {
            font-size: 80px;
            color: var(--primary);
            opacity: 0.8;
        }
        
        .bank-employee {
            width: 180px;
            height: 180px;
        }
        
        .greeting {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 5px;
            font-size: 20px;
        }
        
        .username {
            font-weight: 700;
            color: var(--primary);
            font-size: 30px;
            margin-bottom: 15px;
        }
        
        .welcome-message {
            color: #64748b;
            font-size: 18px;
            line-height: 1.6;
            max-width: 600px;
        }
        
        .card {
            border-radius: var(--card-radius);
            border: none;
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card-header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 20px;
            font-weight: 600;
            color: var(--dark);
            font-size: 18px;
            border-top-left-radius: var(--card-radius) !important;
            border-top-right-radius: var(--card-radius) !important;
        }
        
        .card-body {
            padding: 20px;
        }
        
        .bg-dark-green {
            background: linear-gradient(120deg, var(--primary), var(--secondary));
            color: white;
        }
        
        .quick-actions {
            padding: 15px;
        }
        
        .action-item {
            text-align: center;
            padding: 15px 10px;
            border-radius: 10px;
            background: #f8fafc;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .action-item:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
        }
        
        .action-icon {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--primary);
        }
        .card.bg-dark-green .header {
  background: linear-gradient(120deg, var(--primary), var(--secondary));
  padding: 1rem;
}

.card.bg-dark-green .body {
  background: #1a1a1a; /* solid dark background */
  padding: 1rem;
  border-radius: 0 0 1rem 1rem;
}

        .action-item:hover .action-icon {
            color: white;
        }
        
        .action-title {
            font-weight: 600;
            font-size: 14px;
        }
        
        .stats-container {
            padding: 15px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
        }
        
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 18px;
        }
        
        .stat-details {
            flex: 1;
        }
        
        .stat-value {
            font-weight: 700;
            font-size: 18px;
            color: var(--dark);
        }
        
        .stat-label {
            font-size: 13px;
            color: #64748b;
        }
        
        .recent-transactions {
            padding: 0;
        }
        
        .transaction-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
        }
        </style>

        <div class="welcome-card">
            <div class="welcome-content">
                <!-- Welcome content here -->
            </div>
        </div>

        <!-- Quick Actions and other dashboard content -->

        <div class="legacy-modal" *ngIf="activeModal === 'loanRequest'">
            <div class="legacy-modal__overlay" (click)="closeModal()"></div>
            <div class="legacy-modal__dialog">
                <div class="legacy-modal__header">
                    <h3>Loan Request</h3>
                    <button class="btn-close" type="button" (click)="closeModal()"></button>
                </div>
                <div class="legacy-modal__body">
                    <div class="form-row">
                        <label class="form-field">
                            <span>Loan Term (months)</span>
                            <input type="number" placeholder="12" />
                    </label>
                    <label class="form-field">
                        <span>Purpose</span>
                        <select>
                            <option>Working Capital</option>
                            <option>Bridging</option>
                        </select>
                    </label>
                </div>
                <label class="form-field">
                    <span>Comments</span>
                    <textarea rows="3"></textarea>
                </label>
            </div>
            <div class="legacy-modal__footer">
                <button class="btn btn-outline-secondary" type="button" (click)="closeModal()">Close</button>
                <button class="btn btn-primary" type="button">Submit Request</button>
            </div>
        </div>
    </div>

    <div class="legacy-modal" *ngIf="activeModal === 'workflow'">
        <div class="legacy-modal__overlay" (click)="closeModal()"></div>
        <div class="legacy-modal__dialog">
            <div class="legacy-modal__header">
                <h3>Workflow Queue</h3>
                <button class="btn-close" type="button" (click)="closeModal()"></button>
            </div>
            <div class="legacy-modal__body">
                <div class="workflow-table">
                    <div class="table-row table-row--header">
                        <span>Ref</span>
                        <span>Client</span>
                        <span>Step</span>
                        <span>Priority</span>
                        <span>Received</span>
                    </div>
                    <div class="table-row" *ngFor="let item of workflowQueue">
                        <span>{{ item.ref }}</span>
                        <span>{{ item.client }}</span>
                        <span>{{ item.step }}</span>
                        <span><span class="badge" [ngClass]="item.badgeClass">{{ item.priority }}</span></span>
                        <span>{{ item.received }}</span>
                    </div>
                </div>
            </div>
            <div class="legacy-modal__footer">
                <button class="btn btn-outline-secondary" type="button" (click)="closeModal()">Close</button>
                <button class="btn btn-primary" type="button">Open Workflow Portal</button>
            </div>
        </div>
    </div>
